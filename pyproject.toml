[project]
name = "cvrefine"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-jobspy==1.1.82",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.48",
    "trafilatura>=2.3.1",
    "typesafe-sdk>=0.7.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
